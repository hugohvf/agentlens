<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentLens — AI Context Cost Scanner</title>
<meta name="description" content="Scan any GitHub repo to detect AI agent config files (AGENTS.md, CLAUDE.md, .cursorrules, copilot-instructions), resolve referenced files, and calculate the real context cost per request across all major LLM providers.">
<meta name="author" content="AgentLens">
<meta name="theme-color" content="#1e3a8a">
<meta property="og:title" content="AgentLens — AI Context Cost Scanner">
<meta property="og:description" content="Detect AI agent configs in any repo. Calculate real context token costs across Claude, GPT, Gemini. Dedup shared references. Project team-wide spending.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AgentLens — AI Context Cost Scanner">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%231e3a8a'/><stop offset='100%25' stop-color='%230ea5e9'/></linearGradient></defs><circle cx='42' cy='42' r='28' fill='none' stroke='url(%23g)' stroke-width='8'/><line x1='62' y1='62' x2='90' y2='90' stroke='url(%23g)' stroke-width='10' stroke-linecap='round'/><circle cx='42' cy='42' r='12' fill='%232563eb' opacity='.25'/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --blue:#2563eb;--blue-d:#1e3a8a;--blue-l:#dbeafe;
  --green:#16a34a;--green-l:#dcfce7;
  --orange:#ea580c;--orange-l:#fed7aa;
  --red:#dc2626;--red-l:#fee2e2;
  --purple:#7c3aed;--purple-l:#ede9fe;
  --yellow:#d97706;--yellow-l:#fef3c7;
  --teal:#0d9488;--teal-l:#ccfbf1;
  --pink:#db2777;--pink-l:#fce7f3;
  --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;
  --g400:#9ca3af;--g500:#6b7280;--g700:#374151;--g900:#111827;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4ff;color:var(--g900);line-height:1.6}
.hero{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 55%,#0ea5e9 100%);color:#fff;padding:44px 40px 42px;text-align:center;position:relative}
.hero h1{font-size:2.2rem;font-weight:800;letter-spacing:-1px;margin-bottom:8px}
.hero h1 span{color:#fbbf24}
.hero p{font-size:.98rem;opacity:.85;max-width:580px;margin:0 auto}
.lang-toggle{position:absolute;top:16px;right:20px;display:flex;gap:0;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden}
.lang-btn{padding:6px 14px;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.7);background:none;border:none;cursor:pointer;transition:.15s}
.lang-btn.active{background:rgba(255,255,255,.3);color:#fff}
.container{max-width:980px;margin:0 auto;padding:0 20px}
.input-section{background:#fff;border-radius:18px;padding:30px 32px;box-shadow:0 4px 24px rgba(0,0,0,.08);margin:-24px auto 28px;max-width:800px;position:relative;z-index:10}
.input-label{font-size:.8rem;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:block}
.input-row{display:flex;gap:10px}
.repo-input{flex:1;padding:13px 16px;border:2px solid var(--g200);border-radius:10px;font-size:.95rem;outline:none;color:var(--g900);background:var(--g50);transition:.2s}
.repo-input:focus{border-color:var(--blue);background:#fff}
.fetch-btn{padding:13px 24px;background:linear-gradient(135deg,var(--blue-d),var(--blue));color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.2s}
.fetch-btn:hover{opacity:.9;transform:translateY(-1px)}
.fetch-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.examples{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.examples span{font-size:.78rem;color:var(--g500);font-weight:600}
.example-chip{background:var(--blue-l);color:var(--blue);border:1px solid #bfdbfe;border-radius:99px;padding:2px 11px;font-size:.76rem;font-weight:600;cursor:pointer;transition:.15s}
.example-chip:hover{background:#bfdbfe}
/* STATUS */
#status-area{margin-bottom:20px}
.status-card{background:#fff;border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);font-weight:600;font-size:.92rem}
.status-card.loading{border-left:4px solid var(--blue)}
.status-card.error{border-left:4px solid var(--red)}
.status-card.warn{border-left:4px solid var(--yellow)}
.spinner{width:18px;height:18px;border:3px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* MAIN TABS */
.main-tabs{display:flex;gap:0;margin-bottom:24px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.main-tab{flex:1;padding:14px;text-align:center;font-weight:700;font-size:.92rem;cursor:pointer;border:none;background:none;color:var(--g500);transition:.2s;border-bottom:3px solid transparent}
.main-tab.active{color:var(--blue);background:var(--blue-l);border-bottom-color:var(--blue)}
.main-tab:hover:not(.active){background:var(--g50)}
.tab-panel{display:none}
.tab-panel.active{display:block}
/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 2px 8px rgba(0,0,0,.04);text-align:center}
.stat-num{font-size:1.7rem;font-weight:800;line-height:1;margin-bottom:3px}
.stat-label{font-size:.72rem;color:var(--g500);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat-card.blue .stat-num{color:var(--blue)}.stat-card.green .stat-num{color:var(--green)}.stat-card.purple .stat-num{color:var(--purple)}.stat-card.orange .stat-num{color:var(--orange)}.stat-card.teal .stat-num{color:var(--teal)}.stat-card.pink .stat-num{color:var(--pink)}
/* TOOL GRID */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:12px;margin-bottom:24px}
.tool-card{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;gap:10px;border:2px solid transparent;transition:.2s}
.tool-card.found{border-color:var(--green)}.tool-card.missing{opacity:.38}
.tool-icon{font-size:1.4rem;flex-shrink:0}
.tool-info .tool-name{font-weight:700;font-size:.85rem;margin-bottom:1px}
.tool-info .tool-file{font-family:monospace;font-size:.72rem;color:var(--g500)}
.found-dot{width:9px;height:9px;border-radius:50%;background:var(--green);margin-left:auto;flex-shrink:0}
.miss-dot{width:9px;height:9px;border-radius:50%;background:var(--g300);margin-left:auto;flex-shrink:0}
/* SECTION */
.section{padding:0 0 28px}
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.section-header h2{font-size:1.1rem;font-weight:800}
.pill{border-radius:99px;padding:2px 10px;font-size:.72rem;font-weight:700;background:var(--blue-l);color:var(--blue)}
.pill.green{background:var(--green-l);color:var(--green)}
.pill.teal{background:var(--teal-l);color:var(--teal)}
/* CONTEXT TREE */
.context-tree{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:24px;font-family:monospace;font-size:.84rem}
.tree-item{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px dashed var(--g200)}
.tree-item:last-child{border-bottom:none}
.t-path{flex:1;color:var(--blue)}.t-path.root{color:var(--g900);font-weight:700}.t-path.dedup{color:var(--g400);text-decoration:line-through}
.t-right{display:flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0}
.t-tok{color:var(--g400);font-size:.73rem}
.t-tool{font-size:.67rem;padding:1px 7px;border-radius:99px;font-weight:700}
/* FILE BLOCKS */
.agent-file-block{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:16px}
.agent-file-header{background:linear-gradient(135deg,#f8faff,#eff6ff);border-bottom:1px solid var(--g200);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;cursor:pointer;user-select:none}
.agent-file-header:hover{background:var(--blue-l)}
.agent-file-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.file-badge{background:var(--g900);color:#fff;border-radius:5px;padding:2px 9px;font-family:monospace;font-size:.76rem;font-weight:600}
.agent-file-body{display:none}.agent-file-body.open{display:block}
.tab-bar{display:flex;border-bottom:1px solid var(--g200);padding:0 20px;background:#fff}
.tab-btn{padding:10px 14px;border:none;background:none;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--g500);border-bottom:3px solid transparent;margin-bottom:-1px;transition:.15s}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab-content{display:none;padding:20px}.tab-content.active{display:block}
.md-body{line-height:1.75;color:var(--g700)}.md-body h1,.md-body h2,.md-body h3{color:var(--g900);font-weight:800;margin:18px 0 6px}
.md-body h1{font-size:1.35rem}.md-body h2{font-size:1.1rem}.md-body h3{font-size:.98rem}
.md-body p{margin-bottom:10px}.md-body ul,.md-body ol{margin:6px 0 10px 18px}.md-body li{margin-bottom:3px}
.md-body code{background:var(--g100);border-radius:4px;padding:1px 5px;font-family:monospace;font-size:.86em;color:var(--purple)}
.md-body pre{background:var(--g900);color:#e2e8f0;border-radius:8px;padding:16px;overflow-x:auto;margin:12px 0;font-family:monospace;font-size:.84em;line-height:1.6}
.md-body pre code{background:none;color:inherit;padding:0}.md-body a{color:var(--blue)}
.md-body blockquote{border-left:4px solid var(--blue-l);background:var(--g50);padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0}
.raw-code{background:var(--g900);color:#e2e8f0;border-radius:8px;padding:18px;overflow-x:auto;font-family:monospace;font-size:.82em;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow-y:auto}
/* REFS */
.refs-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.ref-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);border-left:4px solid var(--blue)}
.ref-card.not-found{border-left-color:var(--g400);opacity:.65}
.ref-card-header{padding:12px 16px;background:var(--g50);border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;cursor:pointer;user-select:none}
.ref-card-header:hover{background:var(--blue-l)}
.ref-path{font-family:monospace;font-size:.84rem;font-weight:700}
.ref-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ref-tag{border-radius:99px;padding:1px 9px;font-size:.7rem;font-weight:700;text-transform:uppercase}
.ref-tag.found{background:var(--green-l);color:var(--green)}.ref-tag.missing{background:var(--red-l);color:var(--red)}
.ref-tag.type{background:var(--purple-l);color:var(--purple)}.ref-tag.shared{background:var(--teal-l);color:var(--teal)}
.token-badge{background:var(--blue-l);color:var(--blue);border-radius:99px;padding:2px 9px;font-size:.72rem;font-weight:700}
.ref-content{padding:0 16px;max-height:0;overflow:hidden;transition:max-height .3s,padding .3s}
.ref-content.open{max-height:520px;padding:16px;overflow-y:auto}
/* COST TAB */
.cost-section{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:20px}
.cost-section h3{font-size:1rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:600px){.controls-grid{grid-template-columns:1fr}}
.control-group label{display:block;font-size:.78rem;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.control-group select,.control-group input[type=number]{width:100%;padding:10px 12px;border:2px solid var(--g200);border-radius:8px;font-size:.9rem;outline:none;background:var(--g50);transition:.2s}
.control-group select:focus,.control-group input:focus{border-color:var(--blue);background:#fff}
.slider-group{margin-bottom:14px}
.slider-group label{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.slider-group label span.val{color:var(--blue);font-size:.95rem}
input[type=range]{width:100%;accent-color:var(--blue);height:6px;cursor:pointer}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.toggle-row label{font-size:.82rem;font-weight:600;color:var(--g700)}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;background:var(--g300);border-radius:24px;transition:.2s}
.toggle .slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.slider{background:var(--blue)}
.toggle input:checked+.slider:before{transform:translateX(20px)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--g50);border-radius:10px;padding:16px;text-align:center;border:1px solid var(--g200)}
.kpi .k-num{font-size:1.5rem;font-weight:800;line-height:1;margin-bottom:2px}
.kpi .k-label{font-size:.72rem;color:var(--g500);font-weight:600;text-transform:uppercase}
.kpi.blue .k-num{color:var(--blue)}.kpi.green .k-num{color:var(--green)}.kpi.orange .k-num{color:var(--orange)}.kpi.red .k-num{color:var(--red)}.kpi.purple .k-num{color:var(--purple)}
.chart-box{position:relative;width:100%;height:300px;margin-bottom:16px}
.comparison-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
.comparison-table th{background:var(--g100);font-weight:700;text-align:left;padding:10px 12px;border-bottom:2px solid var(--g200)}
.comparison-table td{padding:9px 12px;border-bottom:1px solid var(--g200)}
.comparison-table tr:hover td{background:var(--blue-l)}
.comparison-table th.sortable:hover{background:var(--blue-l);color:var(--blue)}
.comparison-table .num{text-align:right;font-family:monospace;font-weight:600}
.savings-banner{background:linear-gradient(135deg,var(--teal-l),#d1fae5);border:2px solid var(--teal);border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.savings-banner .s-icon{font-size:1.8rem;flex-shrink:0}
.savings-banner .s-body{flex:1}
.savings-banner .s-title{font-weight:800;font-size:.92rem;color:var(--teal)}
.savings-banner .s-detail{font-size:.84rem;color:var(--g700)}
.savings-banner .s-num{font-size:1.4rem;font-weight:800;color:var(--teal);white-space:nowrap}
.empty-state{text-align:center;padding:50px 20px;color:var(--g500)}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.empty-state h3{font-size:1rem;font-weight:700;color:var(--g700);margin-bottom:6px}
.empty-state p{font-size:.88rem;max-width:380px;margin:0 auto}
footer{text-align:center;padding:28px 20px;color:var(--g400);font-size:.78rem}
.hidden{display:none!important}
/* LOCAL MODE BANNER */
.local-banner{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:14px;padding:18px 24px;margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 4px 20px rgba(37,99,235,.25)}
.local-banner .lb-icon{font-size:2rem;flex-shrink:0}
.local-banner .lb-body{flex:1}
.local-banner .lb-title{font-weight:800;font-size:1rem;margin-bottom:3px}
.local-banner .lb-meta{font-size:.8rem;opacity:.8;font-family:monospace}
.local-banner .lb-badge{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 12px;font-size:.74rem;font-weight:700;white-space:nowrap}
.local-repo-tab{background:var(--g50);border:2px solid var(--g200);border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.15s;margin-bottom:8px}
.local-repo-tab:hover{border-color:var(--blue);background:var(--blue-l)}
.local-repo-tab.active{border-color:var(--blue);background:var(--blue-l)}
.local-repo-tab .lrt-name{font-family:monospace;font-weight:700;font-size:.9rem}
.local-repo-tab .lrt-tok{font-size:.78rem;color:var(--g500);font-weight:600}
/* MODE TABS */
.mode-tabs{display:flex;gap:0;margin-bottom:20px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.mode-tab{flex:1;padding:13px;text-align:center;font-weight:700;font-size:.92rem;cursor:pointer;border:none;background:none;color:var(--g500);transition:.2s;border-bottom:3px solid transparent}
.mode-tab.active{color:var(--blue);background:var(--blue-l);border-bottom-color:var(--blue)}
.mode-tab:hover:not(.active){background:var(--g50)}
/* COMPARE SECTION */
.compare-card{background:#fff;border-radius:18px;padding:28px 32px;box-shadow:0 4px 24px rgba(0,0,0,.08);margin-bottom:24px}
.compare-queue{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.compare-repo-chip{display:flex;align-items:center;justify-content:space-between;background:var(--g50);border:1px solid var(--g200);border-radius:10px;padding:10px 14px}
.compare-repo-chip .crep-name{font-family:monospace;font-size:.9rem;font-weight:700;color:var(--g900)}
.compare-repo-chip .crep-status{font-size:.75rem;color:var(--g500);margin-left:8px}
.crep-right{display:flex;align-items:center;gap:8px}
.remove-chip{background:none;border:none;cursor:pointer;color:var(--g400);font-size:1rem;padding:2px 6px;border-radius:6px;transition:.15s;line-height:1}
.remove-chip:hover{background:var(--red-l);color:var(--red)}
.compare-run-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--blue-d),var(--blue));color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;margin-top:18px}
.compare-run-btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.compare-run-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.cmp-hint{font-size:.8rem;color:var(--g400);text-align:center;margin-top:10px}
.compare-result-table{width:100%;border-collapse:collapse;font-size:.82rem}
.compare-result-table th{background:var(--g100);font-weight:700;text-align:left;padding:10px 12px;border-bottom:2px solid var(--g200)}
.compare-result-table td{padding:9px 12px;border-bottom:1px solid var(--g200);vertical-align:middle}
.compare-result-table tr:hover td{background:var(--blue-l)}
.compare-result-table .num{text-align:right;font-family:monospace;font-weight:600}
.cmp-progress{font-size:.8rem;color:var(--g500);display:flex;align-items:center;gap:6px}
.cmp-scanning{color:var(--blue);font-weight:700}
</style>
</head>
<body>

<div class="hero">
  <div class="lang-toggle">
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn active" onclick="setLang('pt')">PT</button>
  </div>
  <h1><span>Agent</span>Lens</h1>
  <p id="hero-sub"></p>
</div>

<div class="container">
  <!-- LOCAL MODE BANNER (shown when opened from CLI) -->
  <div id="local-banner" class="local-banner hidden" style="margin-top:20px"></div>

  <!-- MODE SWITCHER -->
  <div class="mode-tabs" style="margin-top:20px">
    <button class="mode-tab active" onclick="setMode('analyze')" id="mode-tab-analyze"></button>
    <button class="mode-tab" onclick="setMode('compare')" id="mode-tab-compare"></button>
  </div>

  <!-- ANALYZE SECTION -->
  <div id="section-analyze">
  <div class="input-section">
    <label class="input-label" for="repo-url" id="lbl-repo"></label>
    <div class="input-row">
      <input class="repo-input" id="repo-url" type="text" autocomplete="off" spellcheck="false" />
      <button class="fetch-btn" id="fetch-btn" onclick="analyze()">
        <span id="btn-icon">🔍</span>
        <span id="btn-text"></span>
      </button>
    </div>
    <div class="examples">
      <span>Try:</span>
      <span class="example-chip" onclick="setExample('https://github.com/anthropics/anthropic-cookbook')">anthropic-cookbook</span>

function estimateTokens(t){return Math.round(t.length/4)}
function fmtTok(n){return n>=1000?(n/1000).toFixed(1)+'k':String(n)}
function fmtUSD(n){return n<0.01?'<$0.01':n<1?'$'+n.toFixed(3):n<1000?'$'+n.toFixed(2):'$'+Math.round(n).toLocaleString()}
function fmtBRL(n){const v=n*BRL_RATE;return v<0.01?'<R$0,01':v<1?'R$'+v.toFixed(3).replace('.',','):v<1000?'R$'+v.toFixed(2).replace('.',','):'R$'+Math.round(v).toLocaleString('pt-BR')}
function fmt(n){return document.getElementById('chk-brl').checked?fmtBRL(n):fmtUSD(n)}
function setExample(u){document.getElementById('repo-url').value=u;document.getElementById('repo-url').focus()}
function parseRepoUrl(u){u=u.trim().replace(/\/$/,'');const m=u.match(/github\.com\/([^/]+)\/([^/]+)/);return m?{owner:m[1],repo:m[2].replace(/\.git$/,'')}:null}
function rawUrl(o,r,b,p){return`https://raw.githubusercontent.com/${o}/${r}/${b}/${p}`}

// Reference parser
function parseReferences(content){
  const found=new Map();
  for(const line of content.split('\n')){
    const t=line.trim();
    let m=t.match(/^@import\s+["']?([^\s"']+)["']?/);
    if(m){addR(found,m[1],'import');continue}
    m=t.match(/^[!]?include[:\s]+["']?([^\s"']+\.[a-zA-Z0-9]+)["']?/i);
    if(m){addR(found,m[1],'include');continue}
    m=t.match(/^@(?:file\s+)?([^\s@#]+\.[a-zA-Z0-9]+)/);
    if(m&&!m[1].startsWith('http')){addR(found,m[1],'ref');continue}
    const lr=/\[([^\]]*)\]\(([^)]+)\)/g;let lm;
    while((lm=lr.exec(line))!==null){const h=lm[2].split('#')[0].trim();if(h&&!h.startsWith('http')&&!h.startsWith('mailto')&&h.includes('.'))addR(found,h,'link')}
    m=t.match(/^context[_-]?files?:\s*\[([^\]]+)\]/i);
    if(m){m[1].split(',').forEach(f=>{const p=f.trim().replace(/["']/g,'');if(p)addR(found,p,'context')});continue}
    const cr=/`([^`]+\.[a-zA-Z0-9]+)`/g;let cm;
    while((cm=cr.exec(line))!==null){const p=cm[1];if(!p.startsWith('http')&&p.includes('/')&&p.split('/').length>=2&&p.length<120)addR(found,p,'inline-code')}
  }
  return Array.from(found.values());
}
function addR(map,raw,type){const p=raw.replace(/^\.\//,'').replace(/^\//,'');if(!p||p.startsWith('http')||p.length>200)return;if(!map.has(p))map.set(p,{path:p,type})}

// Markdown renderer
function renderMd(md){let h=md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c.trim()}</code></pre>`).replace(/^#{4}\s(.+)$/gm,'<h4>$1</h4>').replace(/^#{3}\s(.+)$/gm,'<h3>$1</h3>').replace(/^#{2}\s(.+)$/gm,'<h2>$1</h2>').replace(/^#{1}\s(.+)$/gm,'<h1>$1</h1>').replace(/^---+$/gm,'<hr>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>').replace(/^&gt;\s(.+)$/gm,'<blockquote>$1</blockquote>').replace(/^[-*+]\s(.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/gs,m=>`<ul>${m}</ul>`).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');return`<p>${h}</p>`}

// ══════════════════════════════════════
// CORE REPO ANALYZER (reusable, no DOM)
// ══════════════════════════════════════
async function analyzeRepoData(owner,repo){
  const branches=['main','master','develop','trunk'];
  let usedBranch=null;
  for(const b of branches){
    try{
      const r=await fetch(rawUrl(owner,repo,b,'README.md'),{method:'HEAD'});
      if(r.ok){usedBranch=b;break}
      if(r.status===403)return{ok:false,error:'private'}
    }catch(e){}
  }
  if(!usedBranch){
    for(const b of branches){
      try{
        for(const f of ['AGENTS.md','CLAUDE.md','LICENSE']){
          const r=await fetch(rawUrl(owner,repo,b,f),{method:'HEAD'});
          if(r.ok){usedBranch=b;break}
        }
        if(usedBranch)break
      }catch(e){return{ok:false,error:'network'}}
    }
  }
  if(!usedBranch)return{ok:false,error:'notfound'}

  const fetchF=async p=>{try{const r=await fetch(rawUrl(owner,repo,usedBranch,p));if(r.ok)return{path:p,content:await r.text(),found:true}}catch(e){}return{path:p,content:null,found:false}};

  const all=[];AGENT_TOOLS.forEach(t=>t.files.forEach(f=>all.push({toolId:t.id,filePath:f})));
  const res=await Promise.all(all.map(async({toolId,filePath})=>{const r=await fetchF(filePath);return{toolId,...r}}));

  const foundByTool={};
  for(const r of res)if(r.found&&!foundByTool[r.toolId])foundByTool[r.toolId]={path:r.path,content:r.content};

  const foundTools=AGENT_TOOLS.filter(t=>foundByTool[t.id]);
  if(!foundTools.length)return{ok:true,branch:usedBranch,foundByTool:{},uniqueRefs:[],agentTok:0,refTok:0,totalContextTokens:0,noFiles:true};

  const refPool=new Map();
  for(const tool of foundTools){
    const refs=parseReferences(foundByTool[tool.id].content);
    for(const ref of refs){
      if(!refPool.has(ref.path))refPool.set(ref.path,{path:ref.path,type:ref.type,fromTools:new Set([tool.id]),found:false,content:null,tokens:0});
      else refPool.get(ref.path).fromTools.add(tool.id)
    }
  }
  const uniqueRefs=Array.from(refPool.values());
  await Promise.all(uniqueRefs.map(async ref=>{try{const r=await fetch(rawUrl(owner,repo,usedBranch,ref.path));if(r.ok){ref.content=await r.text();ref.found=true;ref.tokens=estimateTokens(ref.content)}}catch(e){}}));

  const agentTok=foundTools.reduce((s,t)=>s+estimateTokens(foundByTool[t.id].content),0);
  const refTok=uniqueRefs.filter(r=>r.found).reduce((s,r)=>s+r.tokens,0);
  return{ok:true,branch:usedBranch,foundByTool,uniqueRefs,agentTok,refTok,totalContextTokens:agentTok+refTok}
}

async function analyze(){
  const url=document.getElementById('repo-url').value.trim();
  if(!url){showStatus('⚠️ Enter a GitHub URL.','warn');return}
  const parsed=parseRepoUrl(url);
  if(!parsed){showStatus('❌ Invalid URL. Use: https://github.com/owner/repo','error');return}
  const{owner,repo}=parsed;
  const btn=document.getElementById('fetch-btn');
  btn.disabled=true;document.getElementById('btn-icon').textContent='⏳';document.getElementById('btn-text').textContent='…';
  document.getElementById('results').classList.add('hidden');document.getElementById('empty-state').classList.add('hidden');
  showStatus(`${T('scanning')} …`,'loading');

  const data=await analyzeRepoData(owner,repo);

  const resetBtn=()=>{btn.disabled=false;document.getElementById('btn-icon').textContent='🔍';document.getElementById('btn-text').textContent=T('btnAnalyze');document.getElementById('empty-state').classList.remove('hidden')};

  if(!data.ok){
    if(data.error==='network')showStatus(`🌐 ${T('errNetwork')}`,'error');
    else showStatus(`🔒 ${T('errPrivate')}<br><span style="font-weight:400;font-size:.84rem;color:var(--g500)">${T('errPrivateDetail')}</span>`,'error');
    resetBtn();return
  }
  if(data.noFiles){showStatus(T('noFiles'),'warn');resetBtn();return}

  STATE.analyzed=true;STATE.totalContextTokens=data.totalContextTokens;STATE.foundByTool=data.foundByTool;STATE.uniqueRefs=data.uniqueRefs;

  clearStatus();
  renderDetection(data.foundByTool,data.uniqueRefs,data.branch);
  document.getElementById('results').classList.remove('hidden');
  document.getElementById('empty-state').classList.add('hidden');
  recalcCost();
  btn.disabled=false;document.getElementById('btn-icon').textContent='🔍';document.getElementById('btn-text').textContent=T('btnAnalyze');
  document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
}

const COMPARE_STATE={repos:[],results:[],chart:null};

function addToCompare(){
  const url=document.getElementById('cmp-url').value.trim();
  if(!url)return;
  const parsed=parseRepoUrl(url);
  if(!parsed){showCmpStatus('❌ URL inválida','error');return}
  const key=`${parsed.owner}/${parsed.repo}`;
  if(COMPARE_STATE.repos.find(r=>r.key===key))return;

  COMPARE_STATE.repos=COMPARE_STATE.repos.filter(r=>r.key!==key);

}

function renderCmpQueue(){

async function runCompare(){

function renderCompareResults(){
  const results=COMPARE_STATE.results;
  if(!results.length)return;

  const modelId=document.getElementById('cmp-sel-model').value;
  const m=PRICING[modelId];
  const devs=+document.getElementById('cmp-sl-devs').value;
  const chats=+document.getElementById('cmp-sl-chats').value;
  document.getElementById('cmp-val-devs').textContent=devs;
  document.getElementById('cmp-val-chats').textContent=chats;
  const isBRL=document.getElementById('chk-brl').checked;

  function costFor(tok){
    const cached=Math.round(tok*0.7);const uncached=tok-cached;
    const ic=(uncached/1e6)*m.input;const cc=(cached/1e6)*(m.cacheRead||0);
    const cw=m.cacheWrite?(cached/1e6)*m.cacheWrite*0.05:0;
    const oc=(2000/1e6)*m.output;
    return ic+cc+cw+oc;
  }

  // Horizontal bar chart
  if(COMPARE_STATE.chart)COMPARE_STATE.chart.destroy();
  COMPARE_STATE.chart=new Chart(document.getElementById('chart-compare'),{
    type:'bar',
    data:{
      labels:results.map(r=>r.key.split('/').pop()),
      datasets:[{
        label:'tokens',
        data:results.map(r=>r.totalContextTokens||0),
        backgroundColor:results.map(r=>{const t=r.totalContextTokens||0;return t<5000?'#16a34a':t<10000?'#d97706':t<20000?'#ea580c':'#dc2626'}),
        borderRadius:8,borderSkipped:false
      }]
    },
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>fmtTok(ctx.parsed.x)+' tokens'}}},
      scales:{x:{grid:{color:'#e5e7eb'},ticks:{callback:v=>fmtTok(v)}},y:{grid:{display:false}}}
    }
  });

  // Table
  const colLabels=[T('cmpColRepo'),T('cmpColTools'),T('cmpColTokens'),'$/req','$/dia','$/mês','$/ano'];
  const hdr=`<thead><tr>${colLabels.map((h,i)=>`<th class="${i>1?'num':''}">${h}</th>`).join('')}</tr></thead>`;

  const rows=results.map(r=>{
    if(!r.ok){
      const errMsg={private:'Repositório privado',network:'Erro de rede',notfound:'Não encontrado'}[r.error]||r.error;
      return`<tr><td><a href="https://github.com/${r.key}" target="_blank" style="color:var(--blue);font-weight:700;text-decoration:none">${r.key}</a></td><td colspan="6" style="color:var(--red);font-size:.82rem">⚠ ${errMsg}</td></tr>`;
    }

    const pr=costFor(tok);const pd=pr*devs*chats;const pm=pd*22;const py=pm*12;
    const hc=tok<5000?'#16a34a':tok<10000?'#d97706':tok<20000?'#ea580c':'#dc2626';
    const foundToolIds=Object.keys(r.foundByTool||{});
    const pills=foundToolIds.map(tid=>{const t=AGENT_TOOLS.find(x=>x.id===tid);return t?`<span style="background:${t.color}22;color:${t.color};border-radius:99px;padding:1px 7px;font-size:.67rem;font-weight:700;display:inline-block;margin:1px">${t.icon} ${t.name}</span>`:''}).join('');
    return`<tr>
      <td><a href="https://github.com/${r.key}" target="_blank" style="color:var(--blue);font-weight:700;text-decoration:none">${r.key}</a>${r.noFiles?`<br><span style="font-size:.72rem;color:var(--g400)">${T('cmpNoConfigs')}</span>`:''}</td>
      <td>${pills||`<span style="color:var(--g400);font-size:.8rem">—</span>`}</td>
      <td class="num"><span style="color:${hc};font-weight:800">${fmtTok(tok)}</span></td>
      <td class="num">${fmt(pr)}</td>
      <td class="num">${fmt(pd)}</td>
      <td class="num">${fmt(pm)}</td>
      <td class="num">${fmt(py)}</td>
    </tr>`;
  }).join('');

  document.getElementById('cmp-result-table').innerHTML=hdr+'<tbody>'+rows+'</tbody>';
  document.getElementById('cmp-results').classList.remove('hidden');
}

// RENDER DETECTION
// ══════════════════════════════════════
function renderDetection(foundByTool,uniqueRefs,branch){
  const foundToolIds=Object.keys(foundByTool);
  const foundTools=AGENT_TOOLS.filter(t=>foundToolIds.includes(t.id));
  const agentTok=foundTools.reduce((s,t)=>s+estimateTokens(foundByTool[t.id].content),0);
  const foundRefs=uniqueRefs.filter(r=>r.found);
  const sharedRefs=uniqueRefs.filter(r=>r.found&&r.fromTools.size>1);
  const uniqueRefTok=foundRefs.reduce((s,r)=>s+r.tokens,0);
  let naiveTot=agentTok;
  for(const t of foundTools){naiveTot+=uniqueRefs.filter(r=>r.fromTools.has(t.id)&&r.found).reduce((s,r)=>s+r.tokens,0)}
  const dedupTot=agentTok+uniqueRefTok;
  const savings=naiveTot-dedupTot;

  // Stats
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat-card green"><div class="stat-num">${foundTools.length}</div><div class="stat-label">${T('tools')}</div></div>
    <div class="stat-card blue"><div class="stat-num">${fmtTok(agentTok)}</div><div class="stat-label">config tokens</div></div>
    <div class="stat-card purple"><div class="stat-num">${uniqueRefs.length}</div><div class="stat-label">${T('refs')}</div></div>
    <div class="stat-card orange"><div class="stat-num">${fmtTok(dedupTot)}</div><div class="stat-label">total context</div></div>
    ${sharedRefs.length?`<div class="stat-card teal"><div class="stat-num">${sharedRefs.length}</div><div class="stat-label">${T('shared')}</div></div>`:''}
    ${savings>0?`<div class="stat-card pink"><div class="stat-num">−${fmtTok(savings)}</div><div class="stat-label">dedup</div></div>`:''}`;

  // Savings banner
  const ban=document.getElementById('savings-banner');
  if(savings>0){ban.classList.remove('hidden');ban.innerHTML=`<div class="s-icon">♻️</div><div class="s-body"><div class="s-title">${T('dedupTitle')}</div><div class="s-detail">${T('dedupDetail')(sharedRefs.length,fmtTok(naiveTot),fmtTok(dedupTot))}</div></div><div class="s-num">−${fmtTok(savings)} tok</div>`}else ban.classList.add('hidden');

  // Tool grid
  document.getElementById('tools-found-pill').textContent=`${foundTools.length} / ${AGENT_TOOLS.length}`;
  document.getElementById('tool-grid').innerHTML=AGENT_TOOLS.map(t=>{const f=!!foundByTool[t.id];const tk=f?estimateTokens(foundByTool[t.id].content):0;return`<div class="tool-card ${f?'found':'missing'}"><div class="tool-icon">${t.icon}</div><div class="tool-info"><div class="tool-name">${t.name}</div><div class="tool-file">${f?foundByTool[t.id].path:t.files[0]}</div>${f?`<div style="font-size:.72rem;color:var(--green);font-weight:700;margin-top:1px">~${fmtTok(tk)} ${T('tokens')}</div>`:''}</div>${f?'<div class="found-dot"></div>':'<div class="miss-dot"></div>'}</div>`}).join('');

  // Context tree
  const treeItems=[];
  for(const tool of foundTools){const{path,content}=foundByTool[tool.id];const tk=estimateTokens(content);
    treeItems.push(`<div class="tree-item"><span style="font-size:1.1rem">${tool.icon}</span><span class="t-path root">${path}</span><div class="t-right"><span class="t-tool" ${toolPill(tool.id)}>${tool.name}</span><span class="t-tok">~${fmtTok(tk)} tok</span></div></div>`);
    const toolRefs=uniqueRefs.filter(r=>r.fromTools.has(tool.id));
    for(const ref of toolRefs){const isShared=ref.fromTools.size>1;const first=[...ref.fromTools][0];const isDup=isShared&&first!==tool.id;
      const icon=!ref.found?'❓':/\.md/.test(ref.path)?'📄':/\.json/.test(ref.path)?'📋':/\.(ts|js|py|go|rs|rb)$/.test(ref.path)?'🟨':'📁';
      treeItems.push(`<div class="tree-item" style="padding-left:18px"><span style="color:var(--g400);margin-right:3px">└─</span><span style="font-size:.9rem">${icon}</span><span class="${isDup?'t-path dedup':'t-path'}" style="${!ref.found?'color:var(--red)':''}">${ref.path}</span><div class="t-right">${isShared?`<span class="t-tool" style="background:#0d948822;color:var(--teal);border-radius:99px;padding:1px 7px;font-size:.67rem;font-weight:700">${isDup?T('already'):T('shared')}</span>`:''}<span class="t-tok">${!ref.found?T('missing'):isDup?'':('~'+fmtTok(ref.tokens)+' tok')}</span></div></div>`)}}
  document.getElementById('context-tree').innerHTML=treeItems.join('');
  document.getElementById('tree-count-pill').textContent=`${foundTools.length} + ${uniqueRefs.length} ${T('files')}`;

  // Agent file viewers
  document.getElementById('agent-files-pill').textContent=`${foundTools.length} ${T('found')}`;
  document.getElementById('agent-files-list').innerHTML=foundTools.map((tool,i)=>{const{path,content}=foundByTool[tool.id];const tk=estimateTokens(content);const bid=`ab-${i}`,rid=`ar-${i}`,wid=`aw-${i}`;
    return`<div class="agent-file-block" id="${bid}"><div class="agent-file-header" onclick="toggleAgentFile(this)"><div class="agent-file-title"><span style="font-size:1.2rem">${tool.icon}</span><span class="file-badge">${path}</span><span style="color:var(--g500);font-size:.8rem">${tool.name}</span></div><div style="display:flex;align-items:center;gap:7px"><span class="token-badge">~${fmtTok(tk)} tok</span><span style="color:var(--g400)">▾</span></div></div><div class="agent-file-body"><div class="tab-bar"><button class="tab-btn active" onclick="switchTab(this,'${rid}','${bid}')">${T('rendered')}</button><button class="tab-btn" onclick="switchTab(this,'${wid}','${bid}')">${T('raw')}</button></div><div class="tab-content active" id="${rid}"><div class="md-body">${renderMd(content)}</div></div><div class="tab-content" id="${wid}"><div class="raw-code">${content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div></div></div>`}).join('');

  // Refs
  const missingRefs=uniqueRefs.filter(r=>!r.found);
  document.getElementById('refs-count-pill').textContent=`${foundRefs.length} ${T('resolved')} · ${missingRefs.length} ${T('missing')}`;
  if(!uniqueRefs.length){document.getElementById('refs-grid').innerHTML=`<div class="empty-state" style="padding:36px;background:#fff;border-radius:14px"><div class="icon">🔍</div><h3>${T('noRefs')}</h3><p>${T('noRefsP')}</p></div>`;return}
  document.getElementById('refs-grid').innerHTML=uniqueRefs.map(ref=>{const isShared=ref.fromTools.size>1;
    const tags=[ref.found?`<span class="ref-tag found">✓</span>`:`<span class="ref-tag missing">✗</span>`,`<span class="ref-tag type">${ref.type}</span>`,isShared?`<span class="ref-tag shared">${T('shared')} ×${ref.fromTools.size}</span>`:'',ref.found?`<span class="token-badge">~${fmtTok(ref.tokens)} tok</span>`:'',...[...ref.fromTools].map(tid=>{const tt=AGENT_TOOLS.find(x=>x.id===tid);return tt?`<span class="t-tool" ${toolPill(tid)}>${tt.icon}</span>`:''})].join('');
    const cnt=ref.found?(/\.(md|mdx)$/.test(ref.path)?`<div class="md-body">${renderMd(ref.content)}</div>`:`<div class="raw-code">${ref.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`):`<p style="color:var(--red);font-style:italic;padding:6px 0">${T('missing')} (${branch})</p>`;
    return`<div class="ref-card ${!ref.found?'not-found':''}"><div class="ref-card-header" onclick="toggleRef(this)"><span class="ref-path">${ref.path}</span><div class="ref-meta">${tags}<span style="color:var(--g400)">▾</span></div></div><div class="ref-content">${cnt}</div></div>`}).join('');

  // Render Context Health
  renderHealth(foundByTool, uniqueRefs);
}

// ══════════════════════════════════════
// CONTEXT HEALTH
// Provider limits & ideal baselines
// ══════════════════════════════════════
const HEALTH_LIMITS = {
  codex:   { ideal:3000, warn:6000,  max:8000,  note:'healthCodexWarn' },
  claude:  { ideal:2000, warn:5000,  max:20000, note:'healthClaudeWarn' },
  cursor:  { ideal:2000, warn:5000,  max:10000, note:null },
  copilot: { ideal:1500, warn:3000,  max:5000,  note:'healthCopilotWarn' },
  windsurf:{ ideal:2000, warn:5000,  max:10000, note:null },
  aider:   { ideal:2000, warn:5000,  max:10000, note:null },
  devin:   { ideal:2000, warn:5000,  max:10000, note:null },
};

function healthGrade(tokens, limit) {
  const ratio = tokens / limit.warn;
  if (ratio <= 0.5) return { label: 'healthLean', color: 'var(--green)', bg: 'var(--green-l)', pct: Math.min(100, (tokens / limit.max) * 100) };
  if (ratio <= 1.0) return { label: 'healthModerate', color: 'var(--yellow)', bg: 'var(--yellow-l)', pct: Math.min(100, (tokens / limit.max) * 100) };
  if (ratio <= 1.6) return { label: 'healthHeavy', color: 'var(--orange)', bg: 'var(--orange-l)', pct: Math.min(100, (tokens / limit.max) * 100) };
  return { label: 'healthBloated', color: 'var(--red)', bg: 'var(--red-l)', pct: 100 };
}

function renderHealth(foundByTool, uniqueRefs) {
  const el = document.getElementById('health-section');
  const foundToolIds = Object.keys(foundByTool);
  const foundTools = AGENT_TOOLS.filter(t => foundToolIds.includes(t.id));
  if (!foundTools.length) { el.innerHTML = ''; return; }

  const totalRef = uniqueRefs.filter(r=>r.found).reduce((s,r)=>s+r.tokens, 0);

  // Per-file health bars
  const bars = foundTools.map(tool => {
    const { path, content } = foundByTool[tool.id];
    const tok = estimateTokens(content);
    const lim = HEALTH_LIMITS[tool.id] || HEALTH_LIMITS.claude;
    const g = healthGrade(tok, lim);
    const warn = lim.note ? `<div style="font-size:.74rem;color:var(--orange);margin-top:4px">${T(lim.note)}</div>` : '';
    const overMax = tok > lim.max;

    return `
      <div style="background:#fff;border-radius:10px;padding:16px 18px;border:1px solid var(--g200);margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:1.1rem">${tool.icon}</span>
            <span style="font-family:monospace;font-weight:700;font-size:.85rem">${path}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:.76rem;font-weight:700;color:${g.color}">${T(g.label).toUpperCase()}</span>
            <span style="font-family:monospace;font-size:.82rem;font-weight:700">${fmtTok(tok)}</span>
            <span style="font-size:.74rem;color:var(--g400)">/ ${fmtTok(lim.ideal)} ${T('healthIdeal')}</span>
          </div>
        </div>
        <div style="background:var(--g200);border-radius:6px;height:8px;overflow:hidden;position:relative">
          <div style="position:absolute;left:0;top:0;height:100%;width:${Math.min(100,(lim.ideal/lim.max)*100)}%;border-right:2px dashed var(--g400);z-index:1"></div>
          <div style="background:${g.color};height:100%;width:${g.pct}%;border-radius:6px;transition:width .3s"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:4px">
          <span style="font-size:.68rem;color:var(--g400)">0</span>
          <span style="font-size:.68rem;color:var(--g400)">┆ ${fmtTok(lim.ideal)} ideal</span>
          <span style="font-size:.68rem;color:var(--g400)">┆ ${fmtTok(lim.warn)} warn</span>
          <span style="font-size:.68rem;color:var(--g400)">${fmtTok(lim.max)}</span>
        </div>
        ${overMax ? `<div style="font-size:.74rem;color:var(--red);font-weight:700;margin-top:4px">⚠ Exceeds recommended maximum (${fmtTok(lim.max)})</div>` : ''}
        ${warn}
      </div>`;
  }).join('');

  // Total context health (config + refs)
  const totalTok = foundTools.reduce((s,t) => s + estimateTokens(foundByTool[t.id].content), 0) + totalRef;
  const totalIdeal = 8000;
  const totalWarn = 20000;
  const totalMax = 50000;
  const tg = healthGrade(totalTok, { ideal: totalIdeal, warn: totalWarn, max: totalMax });

  el.innerHTML = `
    <div class="section-header"><h2>${T('hHealth')}</h2></div>
    <div style="background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:20px">

      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--g200)">
        <div style="width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;color:${tg.color};background:${tg.bg}">${T(tg.label).charAt(0).toUpperCase()}</div>
        <div style="flex:1">
          <div style="font-weight:800;font-size:1rem;margin-bottom:2px">${T('healthTotal')}: <span style="color:${tg.color}">${T(tg.label)}</span></div>
          <div style="font-family:monospace;font-size:.88rem"><span style="font-weight:700">${fmtTok(totalTok)}</span> <span style="color:var(--g400)">total tokens loaded per request</span></div>
        </div>
        <div style="text-align:right">
          <div style="font-size:.74rem;color:var(--g500);font-weight:600">${T('healthBaseline')}</div>
          <div style="font-family:monospace;font-weight:700;font-size:.88rem;color:var(--green)">${fmtTok(totalIdeal)}</div>
        </div>
      </div>

      <div style="background:var(--g200);border-radius:6px;height:10px;overflow:hidden;position:relative;margin-bottom:6px">
        <div style="position:absolute;left:0;top:0;height:100%;width:${Math.min(100,(totalIdeal/totalMax)*100)}%;border-right:2px dashed var(--g400);z-index:1"></div>
        <div style="position:absolute;left:0;top:0;height:100%;width:${Math.min(100,(totalWarn/totalMax)*100)}%;border-right:2px dashed var(--orange);z-index:1"></div>
        <div style="background:${tg.color};height:100%;width:${tg.pct}%;border-radius:6px;transition:width .3s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:.68rem;color:var(--g400);margin-bottom:18px">
        <span>0</span>
        <span>┆ ${fmtTok(totalIdeal)} ideal</span>
        <span>┆ ${fmtTok(totalWarn)} warn</span>
        <span>${fmtTok(totalMax)}</span>
      </div>

      <div style="font-size:.82rem;font-weight:700;color:var(--g700);margin-bottom:10px">${T('healthPerFile')}</div>
      ${bars}
    </div>`;
}

// ══════════════════════════════════════
// COST CALCULATOR
// ══════════════════════════════════════
function recalcCost(){
  if(!STATE.analyzed)return;
  updateSliderLabels();

  const modelId=document.getElementById('sel-model').value;
  const m=PRICING[modelId];
  const outputTok=parseInt(document.getElementById('sel-output').value);
  const devs=parseInt(document.getElementById('sl-devs').value);
  const chats=parseInt(document.getElementById('sl-chats').value);
  const cacheRate=parseInt(document.getElementById('sl-cache').value)/100;
  const isBRL=document.getElementById('chk-brl').checked;

  const ctxTok=STATE.totalContextTokens;
  const cachedTok=Math.round(ctxTok*cacheRate);
  const uncachedTok=ctxTok-cachedTok;

  // Cost per request (in USD)
  const inputCost=(uncachedTok/1e6)*m.input;
  const cacheCost=(cachedTok/1e6)*(m.cacheRead||0);
  const cacheWriteCost=m.cacheWrite?((cachedTok/1e6)*m.cacheWrite*0.05):0; // ~5% of requests are cache misses/writes
  const outputCost=(outputTok/1e6)*m.output;
  const perReq=inputCost+cacheCost+cacheWriteCost+outputCost;

  const perDay=perReq*devs*chats;
  const perMonth=perDay*22;
  const perYear=perMonth*12;

  // KPIs
  document.getElementById('kpi-row').innerHTML=`
    <div class="kpi blue"><div class="k-num">${fmtTok(ctxTok)}</div><div class="k-label">${T('kpiContext')}</div></div>
    <div class="kpi green"><div class="k-num">${fmt(perReq)}</div><div class="k-label">${T('kpiReq')}</div></div>
    <div class="kpi orange"><div class="k-num">${fmt(perDay)}</div><div class="k-label">${T('kpiDay')}</div></div>
    <div class="kpi purple"><div class="k-num">${fmt(perMonth)}</div><div class="k-label">${T('kpiMonth')}</div></div>
    <div class="kpi red"><div class="k-num">${fmt(perYear)}</div><div class="k-label">${T('kpiYear')}</div></div>`;

  // Breakdown donut
  const brkData=[inputCost+cacheWriteCost,cacheCost,outputCost].map(v=>+(v*devs*chats*22).toFixed(2));
  if(chartBreakdown)chartBreakdown.destroy();
  chartBreakdown=new Chart(document.getElementById('chart-breakdown'),{type:'doughnut',data:{labels:[T('brkInput'),T('brkCache'),T('brkOutput')],datasets:[{data:brkData,backgroundColor:['#2563eb','#0d9488','#ea580c'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11,weight:'bold'},padding:12}},tooltip:{callbacks:{label:ctx=>ctx.label+': '+fmt(ctx.parsed)}}}}});

  // Per-dev chart
  const devSteps=[1,5,10,25,50,100].filter(d=>d<=Math.max(devs*2,10));
  if(!devSteps.includes(devs))devSteps.push(devs);
  devSteps.sort((a,b)=>a-b);
  const devCosts=devSteps.map(d=>Math.round(perReq*d*chats*22));

  if(chartPerDev)chartPerDev.destroy();
  chartPerDev=new Chart(document.getElementById('chart-perdev'),{type:'bar',data:{labels:devSteps.map(d=>d+(LANG==='pt'?' devs':' devs')),datasets:[{label:T('perDevTitle'),data:devCosts,backgroundColor:devSteps.map(d=>d===devs?'#2563eb':'#93c5fd'),borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>fmt(ctx.parsed.y)+' '+T('kpiMonth')}}},scales:{y:{ticks:{callback:v=>isBRL?'R$'+Math.round(v*BRL_RATE).toLocaleString('pt-BR'):'$'+v.toLocaleString()},grid:{color:'#e5e7eb'}},x:{grid:{display:false}}}}});

  // Comparison table (sortable)
  const table=document.getElementById('comparison-table');
  const colHeaders=[T('thModel'),T('thReq'),T('thDay'),T('thMonth'),T('thYear')];
  const arrow=i=>sortCol===i?(sortDir===1?'▲':'▼'):'⇅';
  const hdr=`<thead><tr>${colHeaders.map((h,i)=>`<th class="${i?'num':''} sortable" onclick="sortTable(${i})" style="cursor:pointer;user-select:none;white-space:nowrap">${h} <span style="opacity:.4;font-size:.7rem">${arrow(i)}</span></th>`).join('')}</tr></thead>`;

  const rowData=Object.entries(PRICING).map(([id,p])=>{
    const ic=(uncachedTok/1e6)*p.input;
    const cc=(cachedTok/1e6)*(p.cacheRead||0);
    const cw=p.cacheWrite?((cachedTok/1e6)*p.cacheWrite*0.05):0;
    const oc=(outputTok/1e6)*p.output;
    const pr=ic+cc+cw+oc;
    const pd=pr*devs*chats;
    const pm=pd*22;
    const py=pm*12;
    return{id,name:p.name,provider:p.provider,vals:[pr,pd,pm,py]};
  });

  // Sort
  if(sortCol===0) rowData.sort((a,b)=>sortDir*a.name.localeCompare(b.name));
  else rowData.sort((a,b)=>sortDir*(a.vals[sortCol-1]-b.vals[sortCol-1]));

  const rows=rowData.map(r=>{
    const sel=r.id===modelId?'style="background:var(--blue-l);font-weight:700"':'';
    return`<tr ${sel}><td>${r.name}<br><span style="font-size:.7rem;color:var(--g500)">${r.provider}</span></td>${r.vals.map(v=>`<td class="num">${fmt(v)}</td>`).join('')}</tr>`;
  }).join('');
  table.innerHTML=hdr+'<tbody>'+rows+'</tbody>';
}

function sortTable(col){
  if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=col===0?1:-1}
  recalcCost();
}

document.getElementById('repo-url').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()})
document.getElementById('cmp-url').addEventListener('keydown',e=>{if(e.key==='Enter')addToCompare()});

// ══════════════════════════════════════
// PRESEED / LOCAL MODE
// Activated when opened from `agentlens` CLI
// ══════════════════════════════════════
(function(){
  const seed = window.AGENTLENS_LOCAL_DATA;
  if (!seed || !seed.repos || !seed.repos.length) return;

  // Hide GitHub input section — local report needs no URL entry
  document.getElementById('input-section').classList.add('hidden');
  document.getElementById('empty-state').classList.add('hidden');

  // Normalize fromTools: Array → Set (rendering functions expect Set)
  seed.repos.forEach(r => {
    r.uniqueRefs.forEach(ref => {
      ref.fromTools = new Set(Array.isArray(ref.fromTools) ? ref.fromTools : [ref.fromTools]);
    });
  });

  // Show local mode banner
  const banner = document.getElementById('local-banner');
  banner.classList.remove('hidden');
  const repoCount = seed.repos.length;
  const totalTok = seed.repos.reduce((s,r) => s + (r.totalContextTokens || 0), 0);
  const scanDate = seed.generatedAt ? new Date(seed.generatedAt).toLocaleString() : '';
  banner.innerHTML = `
    <div class="lb-icon">🖥️</div>
    <div class="lb-body">
      <div class="lb-title">Local Report${repoCount > 1 ? ` — ${repoCount} repos` : ` — ${seed.repos[0].repoName}`}</div>
      <div class="lb-meta">${repoCount > 1 ? seed.repos.map(r=>r.repoName).join(', ') : seed.repos[0].localPath}${scanDate ? ' · Scanned ' + scanDate : ''}</div>
    </div>
    <div class="lb-badge">~${fmtTok(totalTok)} tokens total</div>`;

  if (seed.repos.length === 1) {
    // Single repo: render directly in Detection + Cost tabs
    const r = seed.repos[0];
    STATE.analyzed = true;
    STATE.totalContextTokens = r.totalContextTokens;
    STATE.foundByTool = r.foundByTool;
    STATE.uniqueRefs = r.uniqueRefs;
    renderDetection(r.foundByTool, r.uniqueRefs, r.repoName);
    document.getElementById('results').classList.remove('hidden');
    recalcCost();
  } else {
    // Multiple local repos: show repo selector tabs + auto-switch to compare mode
    // Render first repo by default, add switcher
    const firstRepo = seed.repos[0];
    STATE.analyzed = true;
    STATE.totalContextTokens = firstRepo.totalContextTokens;
    STATE.foundByTool = firstRepo.foundByTool;
    STATE.uniqueRefs = firstRepo.uniqueRefs;
    renderDetection(firstRepo.foundByTool, firstRepo.uniqueRefs, firstRepo.repoName);
    document.getElementById('results').classList.remove('hidden');
    recalcCost();

    // Inject repo selector above the main tabs
    const tabs = document.querySelector('.main-tabs');
    const selector = document.createElement('div');
    selector.style.cssText = 'margin-bottom:16px';
    selector.innerHTML = `<div style="font-size:.74rem;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Local Repos</div>` +
      seed.repos.map((r, i) =>
        `<div class="local-repo-tab${i===0?' active':''}" onclick="switchLocalRepo(${i})" id="lrt-${i}">
          <span class="lrt-name">${r.repoName}</span>
          <span class="lrt-tok">${r.noFiles ? 'no configs' : '~'+fmtTok(r.totalContextTokens)+' tokens'}</span>
        </div>`
      ).join('');
    tabs.parentNode.insertBefore(selector, tabs);

    // Expose switcher function
    window.__localRepos = seed.repos;
    window.switchLocalRepo = function(idx) {
      document.querySelectorAll('.local-repo-tab').forEach((el, i) => el.classList.toggle('active', i === idx));
      const r = window.__localRepos[idx];
      STATE.analyzed = true;
      STATE.totalContextTokens = r.totalContextTokens;
      STATE.foundByTool = r.foundByTool;
      STATE.uniqueRefs = r.uniqueRefs;
      renderDetection(r.foundByTool, r.uniqueRefs, r.repoName);
      document.getElementById('results').classList.remove('hidden');
      recalcCost();
    };

    // Pre-populate compare queue with all local repos as github-style keys
    seed.repos.forEach(r => {
      const key = `local:${r.repoName}`;
      if (!COMPARE_STATE.repos.find(x => x.key === key)) {
        COMPARE_STATE.repos.push({ key, owner: null, repo: null, localData: r });
      }
    });
  }

  // Pre-populate compare queue with public baselines from .agentlens.json
  (seed.baselines || []).forEach(key => {
    if (!COMPARE_STATE.repos.find(r => r.key === key)) {
      const parts = key.split('/');
      if (parts.length === 2) COMPARE_STATE.repos.push({ key, owner: parts[0], repo: parts[1] });
    }
  });
  renderCmpQueue();
})();
